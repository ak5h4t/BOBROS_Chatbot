<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOBROS Chatbot, React Test</title>

  <!-- Google's chat widget (Dialogflow Messenger), loaded once -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css" />
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <!-- React 19, loaded from a CDN instead of being bundled -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.3.0",
        "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?deps=react@19.3.0"
      }
    }
  </script>

  <style>
    /* Test page layout */
    body {
      margin: 0; min-height: 100vh; box-sizing: border-box; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      background: #f7f8fa; color: #1a1a1a;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card { max-width: 560px; background: #fff; border: 1px solid #f0d9ce; border-radius: 12px; padding: 32px; }
    .card h1 { margin: 0 0 12px; font-size: 24px; color: #fd561e; }
    .card h2 { margin: 24px 0 8px; font-size: 16px; }
    .card p, .card li { font-size: 15px; line-height: 1.6; color: #46536b; }
    .card ul { margin: 0; padding-left: 20px; }

    /* Mounika's BOBROS brand styling for the chat widget, unchanged */
    df-messenger {
      z-index: 999; position: fixed; bottom: 20px; right: 20px;
      --df-messenger-font-family: 'Inter', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --df-messenger-font-color: #1a1a1a;
      --df-messenger-titlebar-background: linear-gradient(135deg, #FD561E 0%, #FF7A45 100%);
      --df-messenger-titlebar-font-color: #ffffff;
      --df-messenger-titlebar-title-font-size: 17px;
      --df-messenger-titlebar-title-font-weight: 600;
      --df-messenger-titlebar-padding: 14px 18px;
      --df-messenger-titlebar-icon-width: 28px;
      --df-messenger-titlebar-icon-height: 28px;
      --df-messenger-titlebar-icon-padding: 0 10px 0 0;
      --df-messenger-titlebar-icon-border-radius: 50%;
      --df-messenger-chat-bubble-background: #FD561E;
      --df-messenger-chat-bubble-icon-color: #ffffff;
      --df-messenger-chat-bubble-size: 60px;
      --df-messenger-chat-bubble-border-radius: 50%;
      --df-messenger-chat-background: #f7f8fa;
      --df-messenger-message-user-background: #FD561E;
      --df-messenger-message-user-font-color: #ffffff;
      --df-messenger-message-bot-background: #ffffff;
      --df-messenger-message-bot-font-color: #1a1a1a;
      --df-messenger-message-border-radius: 14px;
      --df-messenger-message-stack-spacing: 8px;
      --df-messenger-input-background: #ffffff;
      --df-messenger-input-font-color: #1a1a1a;
      --df-messenger-send-icon-color: #FD561E;
      --df-messenger-send-icon-color-hover: #e04512;
      --df-messenger-chip-background: #ffffff;
      --df-messenger-chip-border: 1px solid #FD561E;
      --df-messenger-chip-font-color: #FD561E;
      --df-messenger-chip-hover-background: #fff1ec;
      --df-messenger-chip-border-radius: 20px;
    }
    df-messenger:focus, df-messenger *:focus-visible { outline: none !important; box-shadow: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { createElement as h, Fragment } from "react";
    import { createRoot } from "react-dom/client";

    // Debug logging: every line starts with [abyudh] in the browser Console.
    const log = (...args) => console.log("[abyudh]", ...args);
    const messenger = () => document.querySelector("df-messenger");
    log("script started");
    try {
      log("localStorage keys:", Object.keys(localStorage));
      log("sessionStorage keys:", Object.keys(sessionStorage));
    } catch (e) { log("storage not readable", e); }

    let greeted = false;

    // Fresh page load or refresh: wipe any old chat history.
    function onLoaded() {
      log("widget loaded");
      try { messenger().clearStorage(); log("clearStorage done"); }
      catch (e) { log("clearStorage error", e); }
      try { messenger().startNewSession(); log("startNewSession done"); }
      catch (e) { log("startNewSession error", e); }
      greeted = false;
    }

    // First time the chat is opened: fire the WELCOME event in the agent,
    // so Abyudh greets the user without them typing first.
    function onOpenChanged(event) {
      log("chat open changed:", event.detail);
      if (event.detail?.isOpen && !greeted) {
        greeted = true;
        Promise.resolve(messenger().sendRequest("event", "WELCOME"))
          .then(() => log("WELCOME sent"))
          .catch((e) => log("WELCOME error", e));
      }
    }

    // "true" = capture mode: catches the signals even if they don't bubble up.
    window.addEventListener("df-messenger-loaded", onLoaded, true);
    window.addEventListener("df-chat-open-changed", onOpenChanged, true);

    // The chatbot component (same as ChatWidget.jsx, written without JSX).
    function ChatWidget() {
      return h("df-messenger", {
          "location": "asia-south1",
          "project-id": "bobros-chatbot",
          "agent-id": "df16c437-e0e4-4343-abb4-7216238f2c39",
          "language-code": "en",
          "max-query-length": "-1",
        },
        h("df-messenger-chat-bubble", {
          "chat-title": "Abyudh",
          "placeholder-text": "Ask Abyudh anything...",
        })
      );
    }

    // Root layout: page content, plus <ChatWidget /> once.
    function App() {
      return h(Fragment, null,
        h("main", { className: "card" },
          h("h1", null, "BOBROS chatbot, React test"),
          h("p", null, "Test build of the Abyudh chatbot running inside a React app, before it goes into the main BOBROS application."),
          h("h2", null, "How to test"),
          h("ul", null,
            h("li", null, "Open the chat bubble in the bottom-right corner. Abyudh should greet you without typing anything."),
            h("li", null, "Ask about bookings, cancellations, refunds, payments, insurance, or flights."),
            h("li", null, "Refresh the page. The old conversation should be gone.")
          )
        ),
        h(ChatWidget)
      );
    }

    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
